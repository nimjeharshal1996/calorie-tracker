<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>Calorie Tracker</title>
<style>
  :root {
    --bg: #0b0b0f; --card: #17171d; --card2:#1f1f27; --text: #f2f2f7; --muted: #8e8e93;
    --green: #34c759; --red: #ff453a; --blue: #0a84ff; --line:#2c2c34; --accent:#0a84ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  header { padding: calc(env(safe-area-inset-top) + 14px) 20px 12px; font-size: 28px; font-weight: 700; }
  .page { display:none; padding: 0 16px 24px; }
  .page.active { display:block; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin:12px 0; }
  label { display:block; font-size:13px; color:var(--muted); margin: 10px 0 4px; }
  input, select {
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-size:16px; outline:none;
  }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .result { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .result:last-child { border-bottom:none; }
  .result .k { color:var(--muted); }
  .result .v { font-weight:600; }
  .result .v.hl { color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.4; }

  /* tab bar */
  nav { position:fixed; bottom:0; left:0; right:0; display:flex;
    background:rgba(20,20,26,0.92); backdrop-filter:blur(20px);
    border-top:1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index:50; }
  nav button { flex:1; background:none; border:none; color:var(--muted); padding:10px 0 8px;
    font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav button.active { color:var(--accent); }
  nav button .ic { font-size:20px; }

  /* daily log */
  .datenav { display:flex; align-items:center; justify-content:space-between; }
  .datenav button { background:var(--card2); border:none; color:var(--text); width:40px; height:40px;
    border-radius:20px; font-size:20px; }
  .datenav .d { text-align:center; }
  .datenav .d .wk { font-weight:600; }
  .datenav .d .dt { color:var(--muted); font-size:13px; }
  .ringwrap { display:flex; justify-content:center; margin:8px 0; position:relative; }
  .ringtext { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .ringtext .big { font-size:40px; font-weight:700; }
  .ringtext .sub { color:var(--muted); font-size:13px; }
  .ringtext .rem { font-size:14px; font-weight:600; margin-top:4px; }
  .pbar { height:10px; background:var(--card2); border-radius:5px; overflow:hidden; }
  .pbar > div { height:100%; background:var(--blue); border-radius:5px; transition:width .3s; }
  .meal { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .meal .nm { flex:1; }
  .meal .nm small { display:block; color:var(--muted); font-size:12px; }
  .meal .cal { font-weight:600; }
  .meal .del { background:none; border:none; color:var(--red); font-size:18px; }
  .addbtn { width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:16px; font-weight:600; margin-top:8px; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; }

  /* modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:100;
    align-items:flex-end; }
  .modal.open { display:flex; }
  .sheet { background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:16px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
  .sheet h3 { margin:4px 0 12px; }
  .seg { display:flex; background:var(--card2); border-radius:10px; padding:3px; margin-bottom:12px; }
  .seg button { flex:1; border:none; background:none; color:var(--muted); padding:8px; border-radius:8px; font-size:14px; }
  .seg button.active { background:var(--accent); color:#fff; }
  .foodrow { display:flex; justify-content:space-between; align-items:center; padding:12px 4px;
    border-bottom:1px solid var(--line); }
  .foodrow small { color:var(--muted); font-size:12px; }
  .foodrow.sel { color:var(--accent); }
  .sheetbtns { display:flex; gap:10px; margin-top:16px; }
  .sheetbtns button { flex:1; padding:14px; border-radius:12px; border:none; font-size:16px; font-weight:600; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:disabled { opacity:.4; }
  .btn-cancel { background:var(--card2); color:var(--text); }
  .preview { display:flex; justify-content:space-between; padding:8px 0; }

  /* chart */
  svg text { fill: var(--muted); font-size:10px; }
</style>
</head>
<body>

<header id="title">Profile</header>

<!-- PROFILE -->
<section id="page-profile" class="page active">
  <div class="card">
    <div class="row">
      <div><label>Weight (kg)</label><input id="p-weight" type="number" inputmode="decimal"></div>
      <div><label>Height (cm)</label><input id="p-height" type="number" inputmode="decimal"></div>
    </div>
    <div class="row">
      <div><label>Age</label><input id="p-age" type="number" inputmode="numeric"></div>
      <div><label>Sex</label><select id="p-sex"><option>Male</option><option>Female</option></select></div>
    </div>
    <label>Activity level</label>
    <select id="p-activity">
      <option value="1.2">Sedentary — little or no exercise</option>
      <option value="1.375">Light — 1–3 days/week</option>
      <option value="1.55">Moderate — 3–5 days/week</option>
      <option value="1.725">Active — 6–7 days/week</option>
      <option value="1.9">Very active — hard exercise & job</option>
    </select>
    <div class="row">
      <div><label>Daily deficit (kcal)</label><input id="p-deficit" type="number" inputmode="decimal"></div>
      <div><label>Protein (g/kg)</label><input id="p-ppk" type="number" inputmode="decimal"></div>
    </div>
  </div>

  <div class="card">
    <div class="result"><span class="k">BMR</span><span class="v" id="r-bmr">—</span></div>
    <div class="result"><span class="k">Maintenance</span><span class="v" id="r-maint">—</span></div>
    <div class="result"><span class="k">Daily target</span><span class="v hl" id="r-target">—</span></div>
    <div class="result"><span class="k">Protein target</span><span class="v hl" id="r-protein">—</span></div>
    <div class="hint">Mifflin-St Jeor: BMR = 10·wt + 6.25·ht − 5·age + (5 male / −161 female). Maintenance = BMR × activity. Target = maintenance − deficit.</div>
  </div>
</section>

<!-- DAILY LOG -->
<section id="page-log" class="page">
  <div class="card">
    <div class="datenav">
      <button onclick="changeDay(-1)">‹</button>
      <div class="d"><div class="wk" id="d-wk"></div><div class="dt" id="d-dt"></div></div>
      <button onclick="changeDay(1)">›</button>
    </div>
  </div>
  <div class="card">
    <div class="ringwrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="95" fill="none" stroke="#2c2c34" stroke-width="18"/>
        <circle id="ring" cx="110" cy="110" r="95" fill="none" stroke="var(--green)" stroke-width="18"
          stroke-linecap="round" transform="rotate(-90 110 110)"
          stroke-dasharray="596.9" stroke-dashoffset="596.9"/>
      </svg>
      <div class="ringtext">
        <div class="big" id="ring-cals">0</div>
        <div class="sub" id="ring-target">of 0 kcal</div>
        <div class="rem" id="ring-rem"></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <strong>Protein</strong><span id="prot-txt" style="color:var(--muted)">0 / 0 g</span>
    </div>
    <div class="pbar"><div id="prot-bar" style="width:0%"></div></div>
  </div>
  <div class="card">
    <strong>Meals</strong>
    <div id="meals"></div>
    <button class="addbtn" onclick="openAdd()">+ Add meal</button>
  </div>
</section>

<!-- WEIGHT -->
<section id="page-weight" class="page">
  <div class="card">
    <strong>Trend</strong>
    <div id="chart"></div>
  </div>
  <div class="card">
    <strong>History</strong>
    <div id="weights"></div>
    <button class="addbtn" onclick="openWeight()">+ Log weight</button>
  </div>
</section>

<!-- tab bar -->
<nav>
  <button id="tab-profile" class="active" onclick="showTab('profile')"><span class="ic">👤</span>Profile</button>
  <button id="tab-log" onclick="showTab('log')"><span class="ic">🍴</span>Daily Log</button>
  <button id="tab-weight" onclick="showTab('weight')"><span class="ic">📈</span>Weight</button>
</nav>

<!-- Add meal modal -->
<div class="modal" id="addModal">
  <div class="sheet">
    <h3>Add Meal</h3>
    <div class="seg">
      <button id="seg-search" class="active" onclick="setMode('search')">Search</button>
      <button id="seg-custom" onclick="setMode('custom')">Custom</button>
    </div>
    <div id="mode-search">
      <div id="pick-food">
        <input id="food-q" placeholder="Search food (e.g. chicken, coffee)" oninput="renderResults()">
        <div id="results"></div>
      </div>
      <div id="pick-qty" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong id="sel-name"></strong>
          <button class="btn-cancel" style="padding:6px 12px;border-radius:8px;border:none;" onclick="clearSel()">Change</button>
        </div>
        <label id="qty-label">Grams</label>
        <input id="qty" type="number" inputmode="decimal" oninput="renderPreview()">
        <div class="preview"><span class="k">Calories</span><strong id="pv-cal">0 kcal</strong></div>
        <div class="preview"><span class="k">Protein</span><strong id="pv-prot">0 g</strong></div>
      </div>
    </div>
    <div id="mode-custom" style="display:none">
      <label>Meal name</label><input id="c-name" placeholder="Meal">
      <label>Calories (kcal)</label><input id="c-cal" type="number" inputmode="decimal">
      <label>Protein (g)</label><input id="c-prot" type="number" inputmode="decimal">
    </div>
    <div class="sheetbtns">
      <button class="btn-cancel" onclick="closeAdd()">Cancel</button>
      <button class="btn-primary" id="add-confirm" onclick="confirmAdd()">Add</button>
    </div>
  </div>
</div>

<!-- Add weight modal -->
<div class="modal" id="weightModal">
  <div class="sheet">
    <h3>Log Weight</h3>
    <label>Weight (kg)</label><input id="w-val" type="number" inputmode="decimal">
    <label>Date</label><input id="w-date" type="date">
    <div class="sheetbtns">
      <button class="btn-cancel" onclick="closeWeight()">Cancel</button>
      <button class="btn-primary" onclick="confirmWeight()">Save</button>
    </div>
  </div>
</div>

<script>
// ---------- storage ----------
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
             set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)) };

let profile = LS.get('profile', {weight:95, height:172.7, age:30, sex:'Male', activity:1.55, deficit:700, ppk:2.0});
let foods = LS.get('foods', []);
let weights = LS.get('weights', []);
let selectedDate = startOfDay(new Date());

function saveProfile(){ LS.set('profile', profile); }
function saveFoods(){ LS.set('foods', foods); }
function saveWeights(){ LS.set('weights', weights); }

// ---------- food db ----------
// per 100 g/ml, or per piece. unit: g | ml | pc
const FOODS = [
  {n:"Chicken breast (cooked)", c:165, p:31,   u:"g"},
  {n:"Chicken thigh (cooked)",  c:209, p:26,   u:"g"},
  {n:"Salmon (cooked)",         c:208, p:22,   u:"g"},
  {n:"White rice (cooked)",     c:130, p:2.7,  u:"g"},
  {n:"Brown rice (cooked)",     c:123, p:2.7,  u:"g"},
  {n:"Oats (dry)",              c:389, p:16.9, u:"g"},
  {n:"Greek yogurt",            c:59,  p:10,   u:"g"},
  {n:"Paneer",                  c:265, p:18,   u:"g"},
  {n:"Lentils / dal (cooked)",  c:116, p:9,    u:"g"},
  {n:"Almonds",                 c:579, p:21,   u:"g"},
  {n:"Peanut butter",           c:588, p:25,   u:"g"},
  {n:"White bread",             c:265, p:9,    u:"g"},
  {n:"Banana",                  c:89,  p:1.1,  u:"g"},
  {n:"Apple",                   c:52,  p:0.3,  u:"g"},
  {n:"Whey protein",            c:400, p:80,   u:"g"},
  {n:"Black coffee",            c:1,   p:0.1,  u:"ml"},
  {n:"Whole milk",              c:61,  p:3.2,  u:"ml"},
  {n:"Orange juice",            c:45,  p:0.7,  u:"ml"},
  {n:"Egg (large)",             c:78,  p:6.3,  u:"pc"},
  {n:"Roti / chapati",          c:104, p:3,    u:"pc"},
];
const unitInfo = { g:{basis:100,label:"Grams",def:100,suffix:"g",b:"100 g"},
                   ml:{basis:100,label:"Millilitres",def:250,suffix:"ml",b:"100 ml"},
                   pc:{basis:1,label:"Number of pieces",def:1,suffix:"pc",b:"piece"} };

// ---------- helpers ----------
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function sameDay(a,b){ return startOfDay(new Date(a)).getTime()===startOfDay(b).getTime(); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function round(n){ return Math.round(n); }

// ---------- profile ----------
function bindProfile(){
  const map = {'p-weight':'weight','p-height':'height','p-age':'age','p-deficit':'deficit','p-ppk':'ppk'};
  for(const [id,key] of Object.entries(map)){
    const el = document.getElementById(id);
    el.value = profile[key];
    el.addEventListener('input', ()=>{ profile[key]=num(el.value); saveProfile(); renderProfile(); renderLog(); });
  }
  const sex=document.getElementById('p-sex'); sex.value=profile.sex;
  sex.onchange=()=>{ profile.sex=sex.value; saveProfile(); renderProfile(); };
  const act=document.getElementById('p-activity'); act.value=String(profile.activity);
  act.onchange=()=>{ profile.activity=num(act.value); saveProfile(); renderProfile(); renderLog(); };
}
function calc(){
  const s = profile.sex==='Male'?5:-161;
  const bmr = 10*profile.weight + 6.25*profile.height - 5*profile.age + s;
  const maint = bmr*profile.activity;
  return { bmr, maint, target: maint-profile.deficit, protein: profile.weight*profile.ppk };
}
function renderProfile(){
  const c=calc();
  document.getElementById('r-bmr').textContent = round(c.bmr)+' kcal';
  document.getElementById('r-maint').textContent = round(c.maint)+' kcal';
  document.getElementById('r-target').textContent = round(c.target)+' kcal';
  document.getElementById('r-protein').textContent = round(c.protein)+' g';
}

// ---------- daily log ----------
function changeDay(delta){ const d=new Date(selectedDate); d.setDate(d.getDate()+delta); selectedDate=startOfDay(d); renderLog(); }
function renderLog(){
  document.getElementById('d-wk').textContent = selectedDate.toLocaleDateString(undefined,{weekday:'long'});
  document.getElementById('d-dt').textContent = selectedDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  const day = foods.filter(f=>sameDay(f.date, selectedDate));
  const cals = day.reduce((s,f)=>s+f.calories,0);
  const prot = day.reduce((s,f)=>s+f.protein,0);
  const c = calc();
  // ring
  const prog = c.target>0 ? cals/c.target : 0;
  const circ = 2*Math.PI*95;
  const ring = document.getElementById('ring');
  ring.setAttribute('stroke-dashoffset', circ*(1-Math.min(prog,1)));
  ring.setAttribute('stroke', prog>1 ? 'var(--red)' : 'var(--green)');
  document.getElementById('ring-cals').textContent = round(cals);
  document.getElementById('ring-target').textContent = 'of '+round(c.target)+' kcal';
  const rem = c.target-cals;
  const remEl = document.getElementById('ring-rem');
  remEl.textContent = rem>=0 ? round(rem)+' left' : round(-rem)+' over';
  remEl.style.color = rem>=0 ? 'var(--green)' : 'var(--red)';
  // protein
  document.getElementById('prot-txt').textContent = round(prot)+' / '+round(c.protein)+' g';
  document.getElementById('prot-bar').style.width = Math.min(c.protein>0?prot/c.protein*100:0,100)+'%';
  // meals
  const box=document.getElementById('meals');
  if(day.length===0){ box.innerHTML='<div class="empty">No meals logged yet.</div>'; return; }
  box.innerHTML = day.map(f=>`<div class="meal">
      <div class="nm">${escapeHtml(f.name)}<small>${round(f.protein)} g protein</small></div>
      <div class="cal">${round(f.calories)} kcal</div>
      <button class="del" onclick="deleteFood('${f.id}')">🗑</button>
    </div>`).join('');
}
function deleteFood(id){ foods=foods.filter(f=>f.id!==id); saveFoods(); renderLog(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ---------- add meal modal ----------
let mode='search', sel=null;
function openAdd(){ mode='search'; sel=null; document.getElementById('food-q').value=''; document.getElementById('qty').value='';
  document.getElementById('c-name').value=''; document.getElementById('c-cal').value=''; document.getElementById('c-prot').value='';
  setMode('search'); clearSel(); document.getElementById('addModal').classList.add('open'); }
function closeAdd(){ document.getElementById('addModal').classList.remove('open'); }
function setMode(m){ mode=m;
  document.getElementById('seg-search').classList.toggle('active', m==='search');
  document.getElementById('seg-custom').classList.toggle('active', m==='custom');
  document.getElementById('mode-search').style.display = m==='search'?'block':'none';
  document.getElementById('mode-custom').style.display = m==='custom'?'block':'none';
  updateConfirm();
}
function renderResults(){
  const q=document.getElementById('food-q').value.trim().toLowerCase();
  const list = q==='' ? FOODS : FOODS.filter(f=>f.n.toLowerCase().includes(q));
  const box=document.getElementById('results');
  if(list.length===0){ box.innerHTML='<div class="empty">No match — use Custom.</div>'; return; }
  box.innerHTML = list.map((f)=>{ const i=FOODS.indexOf(f);
    return `<div class="foodrow" onclick="pick(${i})"><span>${f.n}</span>
      <small>${f.c} kcal · ${f.p}g P / ${unitInfo[f.u].b}</small></div>`; }).join('');
}
function pick(i){ sel=FOODS[i]; const info=unitInfo[sel.u];
  document.getElementById('pick-food').style.display='none';
  document.getElementById('pick-qty').style.display='block';
  document.getElementById('sel-name').textContent=sel.n;
  document.getElementById('qty-label').textContent=info.label;
  document.getElementById('qty').value=info.def;
  renderPreview(); updateConfirm();
}
function clearSel(){ sel=null;
  document.getElementById('pick-food').style.display='block';
  document.getElementById('pick-qty').style.display='none';
  renderResults(); updateConfirm();
}
function servingCals(){ const q=num(document.getElementById('qty').value); return sel.c*q/unitInfo[sel.u].basis; }
function servingProt(){ const q=num(document.getElementById('qty').value); return sel.p*q/unitInfo[sel.u].basis; }
function renderPreview(){ if(!sel) return;
  document.getElementById('pv-cal').textContent=round(servingCals())+' kcal';
  document.getElementById('pv-prot').textContent=round(servingProt())+' g';
  updateConfirm();
}
function updateConfirm(){
  const btn=document.getElementById('add-confirm');
  if(mode==='search') btn.disabled = !(sel && num(document.getElementById('qty').value)>0);
  else btn.disabled = !(document.getElementById('c-cal').value!=='');
}
['c-cal','c-prot','c-name'].forEach(id=>document.addEventListener('input',e=>{ if(e.target.id===id) updateConfirm(); }));
function confirmAdd(){
  let entry;
  if(mode==='search' && sel){
    const q=num(document.getElementById('qty').value); const info=unitInfo[sel.u];
    const label = `${round(q)} ${info.suffix}`;
    entry={ id:uid(), name:`${sel.n} — ${label}`, calories:servingCals(), protein:servingProt(), date:selectedDate.toISOString() };
  } else {
    entry={ id:uid(), name:(document.getElementById('c-name').value.trim()||'Meal'),
      calories:num(document.getElementById('c-cal').value), protein:num(document.getElementById('c-prot').value),
      date:selectedDate.toISOString() };
  }
  foods.push(entry); saveFoods(); closeAdd(); renderLog();
}
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

// ---------- weight ----------
function openWeight(){ document.getElementById('w-val').value='';
  document.getElementById('w-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('weightModal').classList.add('open'); }
function closeWeight(){ document.getElementById('weightModal').classList.remove('open'); }
function confirmWeight(){ const v=num(document.getElementById('w-val').value); if(v<=0) return;
  const d=startOfDay(new Date(document.getElementById('w-date').value));
  weights.push({id:uid(), weightKg:v, date:d.toISOString()}); saveWeights(); closeWeight(); renderWeight(); }
function deleteWeight(id){ weights=weights.filter(w=>w.id!==id); saveWeights(); renderWeight(); }
function renderWeight(){
  const sorted=[...weights].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const chart=document.getElementById('chart');
  if(sorted.length<1){ chart.innerHTML='<div class="empty">Log your first weigh-in to see your trend.</div>'; }
  else { chart.innerHTML=buildChart(sorted); }
  const box=document.getElementById('weights');
  if(sorted.length===0){ box.innerHTML='<div class="empty">No weigh-ins yet.</div>'; return; }
  box.innerHTML=[...sorted].reverse().map(w=>`<div class="meal">
    <div class="nm">${new Date(w.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</div>
    <div class="cal">${w.weightKg.toFixed(1)} kg</div>
    <button class="del" onclick="deleteWeight('${w.id}')">🗑</button></div>`).join('');
}
function buildChart(data){
  const W=320,H=200,pad=30;
  const xs=data.map(d=>new Date(d.date).getTime());
  const ys=data.map(d=>d.weightKg);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  let minY=Math.min(...ys), maxY=Math.max(...ys);
  if(minY===maxY){ minY-=1; maxY+=1; } else { const m=(maxY-minY)*0.15; minY-=m; maxY+=m; }
  const sx=x=> maxX===minX ? W/2 : pad+(x-minX)/(maxX-minX)*(W-2*pad);
  const sy=y=> H-pad-(y-minY)/(maxY-minY)*(H-2*pad);
  const pts=data.map(d=>`${sx(new Date(d.date).getTime()).toFixed(1)},${sy(d.weightKg).toFixed(1)}`).join(' ');
  const dots=data.map(d=>`<circle cx="${sx(new Date(d.date).getTime()).toFixed(1)}" cy="${sy(d.weightKg).toFixed(1)}" r="3" fill="var(--blue)"/>`).join('');
  const yTop=`<text x="2" y="${sy(maxY)+4}">${maxY.toFixed(1)}</text>`;
  const yBot=`<text x="2" y="${sy(minY)+4}">${minY.toFixed(1)}</text>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">
    ${yTop}${yBot}
    <polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${pts}"/>${dots}</svg>`;
}

// ---------- tabs ----------
function showTab(t){
  ['profile','log','weight'].forEach(x=>{
    document.getElementById('page-'+x).classList.toggle('active', x===t);
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
  });
  document.getElementById('title').textContent = {profile:'Profile',log:'Daily Log',weight:'Weight'}[t];
  if(t==='log') renderLog(); if(t==='weight') renderWeight();
}

// ---------- init ----------
bindProfile(); renderProfile(); renderLog(); renderWeight();
</script>
